<!DOCTYPE html>

<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Japanese Quiz Game</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div id="menu-screen" class="screen">

        <div class="menu-box">


        <h1>Japanese Quiz Game</h1>

        <h1>JLPT Practice Test</h1>
        <p class="subtitle">Kanji ・Vorabulary・Grammar</p>

        <p>

            Final Score:

            <span id="last-score">0</span>

        </p>

        <p>

            High Score:
            <span id="high-score">0</span>
            
        </p>

        <button onclick="startGame()">Start Game</button>

        <h3>Difficulty</h3>

        <select id="difficulty">
            <option value="n5">N5</option>
            <option value="n4">N4</option>
            <option value="n3">N3</option>
            <option value="n2">N2</option>
            <option value="n1">N1</option>
        </select>

        <h3>Category</h3>
        <select id="category">
            <option value="kanji">Kanji</option>
            <option value="vocabulary">Vocabulary</option>
            <option value="grammar">Grammar</option>
        </select>

        </div>

    </div>

    <div id="game-screen" class="screen hidden">

        <div class="game-box">

            <h1>Japanese Quiz Game</h1>

            <h2 id="timer">time: 10</h2>

            <h3 id="progress">Question 1 / 10</h3>
            <h3 id="message"></h3>

            <h1 id="question">?</h1>

            <div class="buttons">

                <button id="btn1"

                    onclick="checkAnswer(this.innerHTML)">

                </button>

                <button id="btn2"

                    onclick="checkAnswer(this.innerHTML)">

                </button>

                <button id="btn3"

                    onclick="checkAnswer(this.innerHTML)">

                </button>

                <button id="btn4"

                    onclick="checkAnswer(this.innerHTML)">

                </button>

            </div>

            <h2 id="score">คะแนน: 0</h2>

        </div>

    </div>

    <div id="gameover-screen" class="screen hidden">

        <div class="game-box">

        <h1>Game Over</h1>

        <h2>Your Score</h2>

        <h1 id="final-score">0</h1>

        <h2 id="result"></h2>

        <h3 id="percent"></h3>

    <div class="progress">
        <div id="progressBar"></div>
    </div>

    <h3 id="level"></h3>

    <h3 id="bestScore"></h3>

    <h3>Wrong Answers</h3>
    <div id="wrong-list"></div>

        <button onclick="startGame()">
            Play Again
        </button>

        <button onclick="goMenu()">

            戻る

        </button>

        </div>

    </div>

    
    <script src="script.js"></script>

</body>
</html>
